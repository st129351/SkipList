name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev cmake
          cd /usr/src/gtest
          sudo cmake CMakeLists.txt
          sudo make
          sudo cp *.a /usr/lib

      - name: Verify file structure
        run: |
          ls -la
          ls -la include/
          ls -la src/

      - name: Build main executable
        run: |
          make -C ./ skiplist CXXFLAGS="-std=c++17 -I${GITHUB_WORKSPACE}/include -Wall -Werror"

      - name: Build and run tests
        run: |
          make -C ./ tests CXXFLAGS="-std=c++17 -I${GITHUB_WORKSPACE}/include -Wall -Werror"

      - name: Clean all
        run: |
          make cleanall