name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          
      - name: verify include files
        run: |
          echo "Checking SkipList.h exists:"
          ls -la include/SkipList.h || echo "SkipList.h not found!"
          echo "Full structure:"
          ls -laR

      - name: build with explicit paths
        run: |
          g++ -std=c++17 -I${GITHUB_WORKSPACE}/include src/*.cpp -o skiplist
          ./skiplist

      - name: build with Makefile
        run: |
          make skiplist CXXFLAGS="-std=c++17 -I${GITHUB_WORKSPACE}/include"
          make tests CXXFLAGS="-std=c++17 -I${GITHUB_WORKSPACE}/include"
          ./tests

      - name: clean
        run: make cleanall